name: 更新图标合集

on:
  schedule:
    # 每天 06:00 北京时间 = 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 合并图标库
        run: node icons/merge-icons.mjs

      - name: 生成 BoxJs 图标库
        run: node icons/merge-boxjs-icons.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icons/icons-merged.json icons/icons-boxjs.json
          git diff --cached --quiet || git commit -m "自动更新图标合集"
          git push
